<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Files</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 780px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    form { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin-bottom: 1.25rem; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.25rem; }
    label.inline { flex-direction: row; align-items: center; gap: 0.4rem; padding-bottom: 0.45rem; }
    input[type="text"], input[type="password"], input[type="file"] { padding: 0.4rem; font-size: 0.95rem; }
    button { padding: 0.45rem 0.9rem; font-size: 0.9rem; cursor: pointer; background: #f0f0f0; border: 1px solid #ccc; border-radius: 4px; }
    button:hover { background: #e6e6e6; }
    button.danger { color: #a91b1b; border-color: #e2b4b4; background: #fdf4f4; }
    button.danger:hover { background: #fde8e8; }
    button.small { padding: 0.2rem 0.5rem; font-size: 0.8rem; }
    .banner { margin-bottom: 1rem; padding: 0.5rem 0.75rem; border-radius: 4px; font-size: 0.9rem; }
    .banner.ok { background: #e6f7ec; color: #1a7f37; }
    .banner.error { background: #fde8e8; color: #a91b1b; }
    .hidden { display: none !important; }
    #login-view { max-width: 20rem; margin: 5rem auto; }
    #login-view form { flex-direction: column; align-items: stretch; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .whoami { display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; color: #555; }
    .breadcrumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; padding: 0.5rem 0.75rem; background: #f7f7f7; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
    .breadcrumbs a { color: #0969da; text-decoration: none; cursor: pointer; }
    .breadcrumbs a:hover { text-decoration: underline; }
    .breadcrumbs .sep { color: #888; }
    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 0.75rem; margin-bottom: 1rem; }
    .toolbar form { margin-bottom: 0; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 1rem; }
    th, td { text-align: left; padding: 0.45rem 0.6rem; border-bottom: 1px solid #ddd; font-size: 0.9rem; }
    th { color: #555; }
    td.size, th.size { text-align: right; width: 6rem; color: #555; }
    td.mtime, th.mtime { width: 11rem; color: #777; font-size: 0.82rem; }
    td.actions, th.actions { text-align: right; width: 12rem; white-space: nowrap; }
    td.actions button { margin-left: 0.25rem; }
    .entry-link { color: #222; text-decoration: none; cursor: pointer; }
    .entry-link.dir { font-weight: 600; color: #0969da; }
    .entry-link:hover { text-decoration: underline; }
    .empty { color: #777; font-size: 0.9rem; padding: 1rem 0.6rem; }
  </style>
</head>
<body>
  <div id="banner" class="banner hidden"></div>

  <div id="login-view" class="hidden">
    <h1>Files — Sign in</h1>
    <form id="login-form">
      <label>
        Username
        <input id="username" name="username" type="text" autocomplete="username" autofocus required />
      </label>
      <label>
        Password
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
    </form>
  </div>

  <div id="portal-view" class="hidden">
    <div class="topbar">
      <h1>Files</h1>
      <div class="whoami">
        <span id="whoami-user"></span>
        <button type="button" class="small" onclick="signOut()">Sign out</button>
      </div>
    </div>

    <div id="breadcrumbs" class="breadcrumbs"></div>

    <div class="toolbar">
      <form id="upload-form">
        <label>
          Upload file(s)
          <input id="file-input" type="file" name="file" multiple required />
        </label>
        <label class="inline">
          <input id="overwrite-input" type="checkbox" name="overwrite" value="1" />
          Overwrite
        </label>
        <button type="submit">Upload</button>
      </form>
      <div>
        <button type="button" onclick="createFolder()">New folder</button>
        <button type="button" onclick="loadDir(currentPath)">Refresh</button>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th class="size">Size</th>
          <th class="mtime">Modified</th>
          <th class="actions">Actions</th>
        </tr>
      </thead>
      <tbody id="file-rows"></tbody>
    </table>
  </div>

  <script>
    let currentPath = "";

    function showBanner(msg, kind = "error") {
      const el = document.getElementById("banner");
      if (!msg) {
        el.className = "banner hidden";
        el.textContent = "";
        return;
      }
      el.className = `banner ${kind}`;
      el.textContent = msg;
    }

    function formatSize(bytes) {
      if (bytes === null || bytes === undefined) return "—";
      if (bytes < 1024) return `${bytes} B`;
      const units = ["KB", "MB", "GB", "TB"];
      let value = bytes / 1024;
      let idx = 0;
      while (value >= 1024 && idx < units.length - 1) {
        value /= 1024;
        idx++;
      }
      return `${value.toFixed(value >= 10 ? 0 : 1)} ${units[idx]}`;
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toISOString().replace("T", " ").slice(0, 16);
    }

    function showLogin() {
      document.getElementById("portal-view").classList.add("hidden");
      document.getElementById("login-view").classList.remove("hidden");
      document.getElementById("username").focus();
    }

    function showPortal(username) {
      document.getElementById("whoami-user").textContent = username;
      document.getElementById("login-view").classList.add("hidden");
      document.getElementById("portal-view").classList.remove("hidden");
    }

    async function checkSession() {
      const res = await fetch("/api/me");
      if (!res.ok) {
        showLogin();
        return;
      }
      const data = await res.json();
      showPortal(data.username);
      const initial = new URLSearchParams(window.location.search).get("path") || "";
      await loadDir(initial);
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showBanner("");
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showBanner(data.detail || "Sign in failed", "error");
        return;
      }
      document.getElementById("password").value = "";
      showPortal(data.username);
      await loadDir(currentPath);
    });

    async function signOut() {
      await fetch("/api/logout", { method: "POST" });
      showBanner("");
      showLogin();
    }

    function renderBreadcrumbs(path) {
      const box = document.getElementById("breadcrumbs");
      box.innerHTML = "";

      const rootLink = document.createElement("a");
      rootLink.textContent = "root";
      rootLink.onclick = () => loadDir("");
      box.appendChild(rootLink);

      if (!path) return;
      const parts = path.split("/");
      let acc = "";
      for (const part of parts) {
        acc = acc ? `${acc}/${part}` : part;
        const target = acc;
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = "/";
        box.appendChild(sep);

        const link = document.createElement("a");
        link.textContent = part;
        link.onclick = () => loadDir(target);
        box.appendChild(link);
      }
    }

    async function loadDir(path) {
      const params = new URLSearchParams();
      if (path) params.set("path", path);
      const res = await fetch(`/api/fs?${params}`);
      if (res.status === 401) {
        showLogin();
        return;
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showBanner(data.detail || "Failed to load directory", "error");
        return;
      }
      currentPath = data.path || "";
      const url = new URL(window.location);
      if (currentPath) url.searchParams.set("path", currentPath);
      else url.searchParams.delete("path");
      window.history.replaceState({}, "", url);

      renderBreadcrumbs(currentPath);
      renderRows(data.entries || []);
    }

    function renderRows(entries) {
      const tbody = document.getElementById("file-rows");
      tbody.innerHTML = "";

      if (currentPath) {
        const parentPath = currentPath.includes("/")
          ? currentPath.slice(0, currentPath.lastIndexOf("/"))
          : "";
        const upRow = document.createElement("tr");
        const upCell = document.createElement("td");
        upCell.colSpan = 4;
        const upLink = document.createElement("a");
        upLink.className = "entry-link dir";
        upLink.textContent = "..";
        upLink.onclick = () => loadDir(parentPath);
        upCell.appendChild(upLink);
        upRow.appendChild(upCell);
        tbody.appendChild(upRow);
      }

      if (entries.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 4;
        td.className = "empty";
        td.textContent = "Directory is empty.";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      for (const entry of entries) {
        const tr = document.createElement("tr");

        const nameTd = document.createElement("td");
        const link = document.createElement("a");
        if (entry.type === "dir") {
          link.className = "entry-link dir";
          link.textContent = `${entry.name}/`;
          link.onclick = () => loadDir(entry.path);
        } else {
          link.className = "entry-link";
          link.textContent = entry.name;
          link.href = `/api/fs/download?path=${encodeURIComponent(entry.path)}`;
        }
        nameTd.appendChild(link);

        const sizeTd = document.createElement("td");
        sizeTd.className = "size";
        sizeTd.textContent = formatSize(entry.size);

        const mtimeTd = document.createElement("td");
        mtimeTd.className = "mtime";
        mtimeTd.textContent = formatDate(entry.mtime);

        const actionsTd = document.createElement("td");
        actionsTd.className = "actions";

        if (entry.type === "file") {
          const dlBtn = document.createElement("button");
          dlBtn.type = "button";
          dlBtn.className = "small";
          dlBtn.textContent = "Download";
          dlBtn.onclick = () => {
            window.location.href = `/api/fs/download?path=${encodeURIComponent(entry.path)}`;
          };
          actionsTd.appendChild(dlBtn);
        }

        const renBtn = document.createElement("button");
        renBtn.type = "button";
        renBtn.className = "small";
        renBtn.textContent = "Rename";
        renBtn.onclick = () => renameEntry(entry);
        actionsTd.appendChild(renBtn);

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "small danger";
        delBtn.textContent = "Delete";
        delBtn.onclick = () => deleteEntry(entry);
        actionsTd.appendChild(delBtn);

        tr.appendChild(nameTd);
        tr.appendChild(sizeTd);
        tr.appendChild(mtimeTd);
        tr.appendChild(actionsTd);
        tbody.appendChild(tr);
      }
    }

    document.getElementById("upload-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showBanner("");
      const input = document.getElementById("file-input");
      if (!input.files.length) return;

      const form = new FormData();
      form.append("path", currentPath);
      if (document.getElementById("overwrite-input").checked) {
        form.append("overwrite", "1");
      }
      for (const file of input.files) {
        form.append("file", file);
      }

      const res = await fetch("/api/fs/upload", { method: "POST", body: form });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showBanner(data.detail || "Upload failed", "error");
        return;
      }
      input.value = "";
      showBanner(`Uploaded ${data.uploaded.length} file(s)`, "ok");
      await loadDir(currentPath);
    });

    async function createFolder() {
      const name = prompt("New folder name:");
      if (!name || !name.trim()) return;
      showBanner("");
      const target = currentPath ? `${currentPath}/${name.trim()}` : name.trim();
      const res = await fetch("/api/fs/mkdir", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: target }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showBanner(data.detail || "Could not create folder", "error");
        return;
      }
      showBanner(`Created folder ${data.path}`, "ok");
      await loadDir(currentPath);
    }

    async function renameEntry(entry) {
      const newName = prompt(`Rename "${entry.name}" to (name or relative path):`, entry.name);
      if (!newName || !newName.trim() || newName.trim() === entry.name) return;
      showBanner("");
      const res = await fetch("/api/fs/rename", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: entry.path, new_name: newName.trim() }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showBanner(data.detail || "Rename failed", "error");
        return;
      }
      showBanner(`Renamed to ${data.path}`, "ok");
      await loadDir(currentPath);
    }

    async function deleteEntry(entry) {
      const label = entry.type === "dir" ? `directory "${entry.name}/" and all its contents` : `"${entry.name}"`;
      if (!confirm(`Delete ${label}?`)) return;
      showBanner("");
      const res = await fetch(`/api/fs?path=${encodeURIComponent(entry.path)}`, {
        method: "DELETE",
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        showBanner(data.detail || "Delete failed", "error");
        return;
      }
      showBanner(`Deleted ${data.deleted}`, "ok");
      await loadDir(currentPath);
    }

    checkSession();
  </script>
</body>
</html>
