services:
  fs:
    build: .
    image: deploy-utils-fs
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-8004}:8000"
    environment:
      ROOT_DIR: /data/root
      AUTH_DSN: sqlite:////data/auth/auth.db
    volumes:
      - ${HOST_DIR:-/srv/statements}:/data/root
      - ${AUTH_DIR:-./data}:/data/auth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
